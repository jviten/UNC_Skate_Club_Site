<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skate Club at UNC</title>

  <!-- Google Fonts: Anton, Permanent Marker, Cabin Sketch, Special Elite -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Anton&family=Cabin+Sketch:wght@400;700&family=Permanent+Marker&family=Special+Elite&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="styles/global.css">
</head>
<body>

  <main class="paper">

    <!-- four torn edges: bleed past the paper into the wall -->
    <div class="edge edge--top" aria-hidden="true"></div>
    <div class="edge edge--bottom" aria-hidden="true"></div>
    <div class="edge edge--left" aria-hidden="true"></div>
    <div class="edge edge--right" aria-hidden="true"></div>

    <!-- four corner tape pieces, asymmetric -->
    <div class="tape tape--tl" aria-hidden="true"></div>
    <div class="tape tape--tr" aria-hidden="true"></div>
    <div class="tape tape--bl" aria-hidden="true"></div>
    <div class="tape tape--br" aria-hidden="true"></div>

    <div class="paper__inner">

      <!-- hero band: griptape, ONE big ram skull, Anton wordmark right of horns, Carolina-blue capsule -->
      <section class="hero" aria-label="Hero">
        <img
          class="hero__skull"
          src="assets/logo/unc-skate-logo-no-lettering.png"
          alt="UNC Skate Club ram skull mark">
        <h1 class="hero__title">
          <span>Skate Club</span>
          <span>At UNC</span>
        </h1>
        <div class="hero__capsule">
          <span class="line1">spring 26</span>
          <span class="line2">chapel hill</span>
        </div>
        <!-- hand-drawn cream line, scribbled under the capsule -->
        <svg class="hero__scribble" viewBox="0 0 180 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M2,14 C 14,4 28,22 42,10 S 70,20 88,8 S 124,22 142,12 S 170,4 178,16"
                fill="none" stroke="#14171a" stroke-width="2.4" stroke-linecap="round"/>
          <path d="M150,4 L 178,16 L 156,18"
                fill="none" stroke="#14171a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </section>

      <!-- nav row — sits on cream paper BELOW the hero band -->
      <nav class="nav" aria-label="Primary">
        <ul class="nav__list">
          <li><a href="#spots">Spots</a></li>
          <li><a href="#meetings">Meetings</a></li>
          <li><a href="#about">About</a></li>
          <li><a href="#ig">IG</a></li>
        </ul>
      </nav>

      <!-- animated skate handrail divider — inline SVG so CSS classes can target it -->
      <svg class="handrail" viewBox="0 0 1600 180" xmlns="http://www.w3.org/2000/svg"
           style="--speed: 12.5s" aria-hidden="true">
        <ellipse cx="800" cy="158" rx="780" ry="4" fill="rgba(0,0,0,.18)"/>

        <!-- posts -->
        <g>
          <path d="M118 138 L138 138 L150 160 L106 160 Z" fill="#2a2a2a" stroke="#0e0e0e" stroke-width="1.5"/>
          <rect x="100" y="158" width="56" height="6" fill="#222"/>
          <path d="M1462 138 L1482 138 L1494 160 L1450 160 Z" fill="#2a2a2a" stroke="#0e0e0e" stroke-width="1.5"/>
          <rect x="1444" y="158" width="56" height="6" fill="#222"/>
        </g>
        <rect x="118" y="130" width="20" height="14" fill="#2a2a2a" stroke="#0e0e0e" stroke-width="1.5"/>
        <rect x="1462" y="130" width="20" height="14" fill="#2a2a2a" stroke="#0e0e0e" stroke-width="1.5"/>

        <!-- rail bar -->
        <rect x="80" y="124" width="1440" height="14" rx="7" ry="7"
              fill="#1a1a1a" stroke="#0e0e0e" stroke-width="1.5"/>
        <rect x="92" y="126" width="1416" height="2" fill="#ffffff" opacity=".7"/>
        <ellipse cx="80"   cy="131" rx="6" ry="7" fill="#2a2f33" stroke="#0e0e0e" stroke-width="1.5"/>
        <ellipse cx="1520" cy="131" rx="6" ry="7" fill="#2a2f33" stroke="#0e0e0e" stroke-width="1.5"/>

        <g opacity=".55" fill="#ffffff">
          <rect x="220"  y="129" width="60"  height="2"/>
          <rect x="430"  y="129" width="120" height="2"/>
          <rect x="720"  y="129" width="40"  height="2"/>
          <rect x="980"  y="129" width="180" height="2"/>
          <rect x="1250" y="129" width="80"  height="2"/>
        </g>

        <!-- skater -->
        <g class="skater">
          <g transform="translate(160 124) scale(0.7)">
            <g class="sparks" fill="#ffd166">
              <circle cx="-30" cy="6" r="2.4"/>
              <circle cx="-36" cy="3" r="1.7"/>
              <circle cx="-22" cy="8" r="1.9"/>
              <circle cx="-28" cy="0" r="1.4"/>
            </g>

            <g fill="#0a0a0a" stroke="#0a0a0a" stroke-linejoin="round" stroke-linecap="round">
              <!-- board -->
              <path d="M-34 -6 Q -38 -6 -38 -2 L -38 0 Q -38 4 -34 4 L 34 4 Q 38 4 38 0 L 38 -2 Q 38 -6 34 -6 Z"/>
              <rect x="-26" y="2" width="4" height="4"/>
              <rect x="22"  y="2" width="4" height="4"/>
              <circle cx="-24" cy="7" r="2.8"/>
              <circle cx="24"  cy="7" r="2.8"/>

              <!-- legs -->
              <path d="M -8 -55 L 4 -30 L -22 -8" stroke-width="11" fill="none"/>
              <path d="M 10 -56 L 24 -30 L 18 -8" stroke-width="11" fill="none"/>

              <!-- torso -->
              <path d="M -14 -100 L 16 -103 L 14 -58 L -10 -55 Z"/>

              <!-- arms -->
              <path d="M -12 -98 L -32 -80 L -22 -58" stroke-width="7" fill="none"/>
              <path d="M 16 -100 L 34 -90 L 46 -78" stroke-width="7" fill="none"/>

              <!-- neck -->
              <rect x="-2" y="-108" width="8" height="9"/>

              <!-- head -->
              <circle cx="3" cy="-117" r="9"/>

              <!-- hat: cap -->
              <g>
                <path d="M -7 -117 A 10 10 0 0 1 13 -117 L 12 -114 L -6 -114 Z"/>
                <path d="M 11 -116 L 26 -113 L 26 -109 L 10 -112 Z"/>
              </g>
            </g>
          </g>
        </g>
      </svg>

      <!-- meeting info — cream paper, below the nav row -->
      <section class="meeting" aria-label="Meeting info">
        <p class="meeting__when">thursdays &middot; 6:30 &middot; the pit</p>
        <p class="meeting__welcome">any board. any wheels. first time on one is fine.</p>
      </section>

      <!-- inner tear: ~6px wide slit, asymmetric placement -->
      <div class="inner-tear" aria-hidden="true"></div>

      <div class="tail"></div>

    </div><!-- /.paper__inner -->

  </main>

</body>
</html>
