[project]
name = "uncskate-backend"
version = "0.1.0"
description = "UNC Skate Club spot map backend (FastAPI + Postgres/PostGIS)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "geoalchemy2[shapely]>=0.15",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.14.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "pytest>=9.0.3",
]
