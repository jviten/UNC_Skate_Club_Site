services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: uncskate
      POSTGRES_PASSWORD: uncskate
      POSTGRES_DB: uncskate
    ports:
      # Host port 5433 (5432 is often occupied by another local Postgres).
      - "5433:5432"
    volumes:
      - uncskate_pgdata:/var/lib/postgresql/data

volumes:
  uncskate_pgdata:
