<?xml version="1.0" encoding="UTF-8"?>
<!-- white masking tape: off-white, visible fiber grain, slightly fuzzy torn ends. ~105 long. -->
<svg xmlns="http://www.w3.org/2000/svg" width="105" height="30" viewBox="0 0 105 30">
  <defs>
    <filter id="masking-fiber">
      <feTurbulence type="fractalNoise" baseFrequency="0.7 3.2" numOctaves="2" seed="11"/>
      <feColorMatrix values="0 0 0 0 0.78
                             0 0 0 0 0.74
                             0 0 0 0 0.65
                             0 0 0 0.4 0"/>
    </filter>
  </defs>
  <path fill="#ece6d2"
    d="M1,4 L5,2 L9,5 L13,3 L17,6 L13,9 L16,13 L11,15 L14,19
       L9,21 L13,24 L8,27 L12,29 L20,28 L30,30 L42,28 L54,30
       L66,28 L80,30 L92,28 L100,29 L103,26 L105,22 L102,18
       L104,14 L100,10 L103,7 L99,4 L102,1 L92,2 L80,0 L68,2
       L54,0 L42,2 L30,0 L18,2 L10,0 Z"/>
  <!-- fiber overlay -->
  <rect x="0" y="0" width="105" height="30" filter="url(#masking-fiber)" opacity="0.35"/>
  <!-- a couple of long horizontal fibers -->
  <line x1="8" y1="11" x2="98" y2="13" stroke="#bcb59c" stroke-width="0.4" opacity="0.5"/>
  <line x1="6" y1="19" x2="100" y2="17" stroke="#bcb59c" stroke-width="0.4" opacity="0.4"/>
</svg>
