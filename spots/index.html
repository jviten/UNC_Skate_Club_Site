<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Spots · Skate Club at UNC</title>

  <!-- Google Fonts: Anton, Permanent Marker, Cabin Sketch, Special Elite (locked type system) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Anton&family=Cabin+Sketch:wght@400;700&family=Permanent+Marker&family=Special+Elite&display=swap"
    rel="stylesheet">

  <!-- Leaflet 1.9.4, pinned + SRI integrity (official hashes) -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin="">

  <link rel="stylesheet" href="../styles/global.css">
  <link rel="stylesheet" href="map.css">
</head>
<body class="spots-body">

  <!-- inline SVG sprite: one hand-drawn single-stroke glyph per spot type.
       <use>-referenced from every marker so it's one definition, reused. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <!-- ledge: a low flat-topped curb in profile -->
      <symbol id="g-ledge" viewBox="0 0 24 24">
        <path d="M3 15 L3 11 L21 11 L21 15" fill="none" stroke="currentColor"
          stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
      <!-- stairs: a 3-step zigzag -->
      <symbol id="g-stairs" viewBox="0 0 24 24">
        <path d="M3 17 L9 17 L9 13 L15 13 L15 9 L21 9" fill="none" stroke="currentColor"
          stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
      <!-- rail: a diagonal handrail with two posts -->
      <symbol id="g-rail" viewBox="0 0 24 24">
        <path d="M4 7 L20 15 M8 9.5 L8 18 M16 13.5 L16 18" fill="none" stroke="currentColor"
          stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
      <!-- transition: a quarterpipe curve rising to a coping tick -->
      <symbol id="g-transition" viewBox="0 0 24 24">
        <path d="M3 18 Q3 6 17 6 M16 4 L20 6" fill="none" stroke="currentColor"
          stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
      <!-- flat: a single horizontal line with a dot (open ground) -->
      <symbol id="g-flat" viewBox="0 0 24 24">
        <path d="M3 13 L21 13" fill="none" stroke="currentColor"
          stroke-width="2.4" stroke-linecap="round"/>
        <circle cx="12" cy="13" r="0.6" fill="currentColor" stroke="currentColor" stroke-width="1.2"/>
      </symbol>
      <!-- DIY: two crossed strips of tape (DIY ethos) -->
      <symbol id="g-DIY" viewBox="0 0 24 24">
        <path d="M5 6 L19 18 M19 6 L5 18" fill="none" stroke="currentColor"
          stroke-width="2.4" stroke-linecap="round"/>
      </symbol>
    </defs>
  </svg>

  <!-- full-bleed map fills the viewport; all chrome floats over it -->
  <div id="map" role="application" aria-label="Chapel Hill and Carrboro skate spot map"></div>

  <!-- top-left taped title block + ram-skull home button -->
  <div class="chrome chrome--title">
    <a class="home-skull" href="../index.html" aria-label="Back to Skate Club at UNC">
      <img src="../assets/logo/unc-skate-logo-no-lettering.png" alt="UNC Skate Club ram skull">
    </a>
    <div class="title-tape">
      <span class="title-tape__big">SPOTS</span>
      <span class="title-tape__sub">chapel hill + carrboro</span>
    </div>
  </div>

  <!-- masking-tape banner: ONLY shown if an API hydrate was attempted and failed -->
  <div class="stale-banner" id="staleBanner" hidden>
    showing last-saved spots
  </div>

  <!-- submit affordance (dark in v1: submissions not open) -->
  <button type="button" class="chrome submit-dark" disabled>submissions soon</button>

  <!-- thumb-zone filter strip: doubles as the legend -->
  <div class="chrome filter-strip" id="filterStrip">
    <div class="filter-row filter-row--type" id="typeRow" aria-label="filter by what">
      <span class="filter-row__label">what</span>
      <!-- type chips injected by map.js -->
    </div>
    <div class="filter-row filter-row--bust" id="bustRow" aria-label="filter by how hot">
      <span class="filter-row__label">how hot</span>
      <!-- bust chips injected by map.js -->
    </div>
    <button type="button" class="chip chip--reset" id="resetChip">show all</button>
  </div>

  <!-- empty-filter taped note (hidden until a filter combo returns nothing) -->
  <div class="empty-note" id="emptyNote" hidden>nothing matches — loosen it up</div>

  <!-- detail bottom sheet (mobile) / side panel (desktop). One element, reused. -->
  <div class="sheet" id="detailSheet" hidden aria-hidden="true" role="dialog" aria-label="spot detail">
    <span class="sheet__tape" aria-hidden="true"></span>
    <button type="button" class="sheet__close" id="sheetClose" aria-label="close">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M5 6 L19 19 M18 5 L6 18" fill="none" stroke="currentColor"
          stroke-width="2.6" stroke-linecap="round"/>
      </svg>
    </button>
    <div class="sheet__body" id="sheetBody"><!-- filled per spot --></div>
  </div>

  <!-- loading stamp: ram skull instead of a spinner. Removed once spots paint. -->
  <div class="load-stamp" id="loadStamp">
    <img src="../assets/logo/unc-skate-logo-no-lettering.png" alt="">
    <span>finding spots…</span>
  </div>

  <!-- Leaflet 1.9.4, pinned + SRI integrity (official hash) -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""></script>
  <script src="map.js"></script>
</body>
</html>
